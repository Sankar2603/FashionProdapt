# Fashion search: infrastructure + services.

services:
  # ---------------------------------------------------------------- infra
  redis:
    image: redis:7.4-alpine
    container_name: fs-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: fs-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST API + web dashboard
      - "127.0.0.1:6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    # To require an API key (e.g. when deploying), uncomment and set QDRANT_API_KEY in .env:
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------- services
  query:
    build:
      context: .
      dockerfile: services/query_service/Dockerfile
    container_name: fs-query
    env_file: .env
    environment:
      # Inside the Docker network, services reach each other by name.
      REDIS_URL: redis://redis:6379/0
      # Only used when LLM_PROVIDER=ollama (Ollama running on your Windows host).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval_service/Dockerfile
    container_name: fs-retrieval
    env_file: .env
    environment:
      # Inside the Docker network, services reach each other by name.
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_DEVICE: cpu
      HF_HOME: /hf-cache
      # 0 = download the model if it's missing (first start on a new machine).
      # Set HF_HUB_OFFLINE=1 in .env when HF_CACHE_DIR points at an existing cache.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      # HF_CACHE_DIR set in .env -> reuse that host folder (no re-download).
      # Not set -> Docker volume "hf_cache"; the model downloads into it once.
      - ${HF_CACHE_DIR:-hf_cache}:/hf-cache
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s   # first start may download the model (~2.3 GB)
    restart: unless-stopped

  rerank:
    build:
      context: .
      dockerfile: services/rerank_service/Dockerfile
    container_name: fs-rerank
    env_file: .env
    environment:
      RERANKER_DEVICE: cpu
      HF_HOME: /hf-cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      # Same model cache as retrieval: both models live side by side in it.
      - ${HF_CACHE_DIR:-hf_cache}:/hf-cache
    ports:
      - "127.0.0.1:8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s   # first start may download the model (~2.3 GB)
    restart: unless-stopped
  
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: fs-gateway
    env_file: .env
    environment:
      # Inside the Docker network, services reach each other by name.
      REDIS_URL: redis://redis:6379/0
      QUERY_SERVICE_URL: http://query:8001
      RETRIEVAL_SERVICE_URL: http://retrieval:8003
      RERANK_SERVICE_URL: http://rerank:8004
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      query:
        condition: service_started
      retrieval:
        condition: service_started
      rerank:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: services/catalog_service/Dockerfile
    container_name: fs-catalog
    env_file: .env
    environment:
      # Inside the Docker network, services reach each other by name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fs-frontend
    env_file: .env
    environment:
      # Inside the Docker network, services reach each other by name.
      GATEWAY_URL: http://gateway:8000
      QUERY_URL: http://query:8001
      CATALOG_URL: http://catalog:8002
      RETRIEVAL_URL: http://retrieval:8003
      RERANK_URL: http://rerank:8004
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      gateway:
        condition: service_started
      catalog:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: fs-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/1
      # db 0: bumps the catalogue version that invalidates the search-result cache.
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_DEVICE: cpu
      # Reuse the model already downloaded on the host.
      HF_HOME: /hf-cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_CACHE_DIR:-hf_cache}:/hf-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: fs-beat
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
  hf_cache: